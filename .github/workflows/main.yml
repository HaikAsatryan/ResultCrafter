name: Publish ResultCrafter To NuGet

env:
  NUGET_SOURCE: https://api.nuget.org/v3/index.json
  OUTPUT_DIR: nupkgs

on:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Environment Settings

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      # Pack runs NuGet package validation (EnablePackageValidation). No baseline comparison for
      # 2.0.0 (intentional breaking release); set PackageValidationBaselineVersion to 2.0.0 in
      # Directory.Build.targets after it ships so later releases validate against it.
      - name: Pack
        run: dotnet pack ResultCrafter.slnx --no-build --configuration Release --output ${{ env.OUTPUT_DIR }}

      - name: Publish packages
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${NUGET_API_KEY:-}" ]; then
            echo "NUGET_API_KEY is missing. If you stored it as an Environment secret, set jobs.publish.environment to that Environment name."
            exit 1
          fi

          shopt -s nullglob

          nupkgs=( "${{ env.OUTPUT_DIR }}"/*.nupkg )

          if [ ${#nupkgs[@]} -eq 0 ]; then
            echo "No .nupkg files found in ${{ env.OUTPUT_DIR }}"
            ls -la "${{ env.OUTPUT_DIR }}" || true
            exit 1
          fi

          # dotnet nuget push auto-pushes matching .snupkg symbol packages from the same directory.
          dotnet nuget push "${nupkgs[@]}" --api-key "$NUGET_API_KEY" --source "${{ env.NUGET_SOURCE }}" --skip-duplicate
