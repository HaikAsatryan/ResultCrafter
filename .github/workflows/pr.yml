name: Pull Request Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # global.json pins the .NET 11 SDK; 10.0.x adds the .NET 10 runtime the net10.0 tests run on.
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release -warnaserror

      - name: Test (net10.0 and net11.0)
        run: dotnet test --no-build --configuration Release --verbosity normal

  aot-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      # NativeAOT on Ubuntu needs clang. GitHub's Ubuntu images ship it; install only if missing.
      - name: NativeAOT prerequisites
        run: command -v clang >/dev/null || (sudo apt-get update && sudo apt-get install -y clang)

      - name: NativeAOT publish and smoke test (net10.0 and net11.0)
        run: bash tests/ResultCrafter.AotSmoke/run-aot-smoke.sh
